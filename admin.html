<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Codes d'accès</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    select,
    textarea,
    button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    button.copy {
      background: #16a34a;
      margin-top: 12px;
    }

    textarea {
      height: 320px;
      resize: vertical;
      line-height: 1.5;
    }

    .code-box {
      margin-top: 15px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Admin — Génération accès client</h1>

    <label for="formation">Formation achetée</label>
    <select id="formation">
      <option value="cinema">🎬 Cinéma & IA</option>
      <option value="marketing">📱 Marketing Digital</option>
      <option value="vip">🚀 Pack Complet</option>
    </select>

    <button onclick="genererMessage()">Générer le code</button>

    <div class="code-box" id="codeBox">
      Code généré : —
    </div>

    <textarea id="message" placeholder="Le message WhatsApp apparaîtra ici..."></textarea>

    <button class="copy" onclick="copierMessage()">Copier le message WhatsApp</button>
  </div>

  <script>
    const lienSite = "[formationespoir.netlify.app](https://formationespoir.netlify.app)";

    function genererCode(prefixe) {
      const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "";

      for (let i = 0; i < 6; i++) {
        code += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
      }

      return prefixe + "-" + code;
    }

    function genererMessage() {
      const formation = document.getElementById("formation").value;

      let code = "";
      let message = "";

      if (formation === "cinema") {
        code = genererCode("CINEMA");

        message = `Bonjour 👋

Votre accès à la formation 🎬 Cinéma & Intelligence Artificielle est validé.

Lien d’accès :
${lienSite}

Code d’accès :
${code}

Important : gardez ce code confidentiel. Il est personnel.

Bienvenue dans VOIE D’ESPOIR 🚀`;
      }

      if (formation === "marketing") {
        code = genererCode("MARKETING");

        message = `Bonjour 👋

Votre accès à la formation 📱 Marketing Digital est validé.

Lien d’accès :
${lienSite}

Code d’accès :
${code}

Important : gardez ce code confidentiel. Il est personnel.

Bienvenue dans VOIE D’ESPOIR 🚀`;
      }

      if (formation === "vip") {
        code = genererCode("VIP");

        message = `Bonjour 👋

Votre accès complet 🚀 VOIE D’ESPOIR est validé.

Lien d’accès :
${lienSite}

Code d’accès VIP :
${code}

Important : gardez ce code confidentiel. Il est personnel.

Bienvenue dans VOIE D’ESPOIR 🚀`;
      }

      document.getElementById("codeBox").textContent = "Code généré : " + code;
      document.getElementById("message").value = message;
    }

    function copierMessage() {
      const message = document.getElementById("message");

      if (!message.value.trim()) {
        alert("Générez d’abord un message.");
        return;
      }

      message.select();
      message.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(message.value)
        .then(() => {
          alert("Message WhatsApp copié ✅");
        })
        .catch(() => {
          alert("Copie impossible. Sélectionnez le texte et copiez manuellement.");
        });
    }
  </script>
</body>
</html>
