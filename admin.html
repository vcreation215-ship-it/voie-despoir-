<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Génération accès client</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 24px;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    textarea,
    button {
      width: 100%;
      font-size: 16px;
      box-sizing: border-box;
    }

    select {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      margin-bottom: 16px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .generate {
      background: #111827;
      color: white;
    }

    .copy {
      background: #16a34a;
      color: white;
    }

    textarea {
      min-height: 300px;
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      resize: vertical;
      line-height: 1.5;
    }

    .code-box {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Admin — Génération accès client</h1>

    <label for="offer">Formation achetée</label>
    <select id="offer">
      <option value="cinema">🎬 Cinéma & IA</option>
      <option value="marketing">📱 Marketing Digital</option>
      <option value="pack">🚀 Pack Complet</option>
    </select>

    <button class="generate" onclick="generateMessage()">
      Générer le code et le message
    </button>

    <div class="code-box" id="codeBox">
      Code généré : —
    </div>

    <textarea id="message" placeholder="Le message WhatsApp apparaîtra ici..."></textarea>

    <button class="copy" onclick="copyMessage()">
      Copier le message WhatsApp
    </button>
  </div>

  <script>
    const accessLink = "[comforting-jelly-c52490.netlify.app](https://comforting-jelly-c52490.netlify.app)";

    function generateCode(prefix) {
      const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase();
      return `${prefix}-${randomPart}`;
    }

    function generateMessage() {
      const offer = document.getElementById("offer").value;
      const messageBox = document.getElementById("message");
      const codeBox = document.getElementById("codeBox");

      let code = "";
      let message = "";

      if (offer === "cinema") {
        code = generateCode("CINEMA");

        message = `Bonjour 👋

Votre accès à la formation 🎬 Cinéma & Intelligence Artificielle est validé.

Lien d’accès :
${accessLink}

Code d’accès :
${code}

Important : gardez ce code confidentiel. Il est personnel.

Bienvenue dans VOIE D’ESPOIR 🚀`;
      }

      if (offer === "marketing") {
        code = generateCode("MARKETING");

        message = `Bonjour 👋

Votre accès à la formation 📱 Marketing Digital est validé.

Lien d’accès :
${accessLink}

Code d’accès :
${code}

Important : gardez ce code confidentiel. Il est personnel.

Bienvenue dans VOIE D’ESPOIR 🚀`;
      }

      if (offer === "pack") {
        code = generateCode("VIP");

        message = `Bonjour 👋

Votre accès complet 🚀 VOIE D’ESPOIR est validé.

Liens d’accès :
🎬 Cinéma & IA :
${accessLink}

📱 Marketing Digital :
${accessLink}

Code d’accès VIP :
${code}

Important : gardez ce code confidentiel. Il est personnel.

Bienvenue dans VOIE D’ESPOIR 🚀`;
      }

      codeBox.textContent = `Code généré : ${code}`;
      messageBox.value = message;
    }

    function copyMessage() {
      const messageBox = document.getElementById("message");

      if (!messageBox.value.trim()) {
        alert("Générez d’abord un message.");
        return;
      }

      messageBox.select();
      messageBox.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(messageBox.value)
        .then(() => {
          alert("Message WhatsApp copié ✅");
        })
        .catch(() => {
          alert("Impossible de copier automatiquement. Copiez manuellement le texte.");
        });
    }
  </script>
</body>
</html>
