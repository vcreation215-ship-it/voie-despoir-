<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Voie d'Espoir</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Écran de connexion -->
<section class="card" id="login-section">
  <div class="service-box">
    <b>🔐 Connexion Administrateur</b>
    <p>Entrez votre mot de passe</p>

    <input id="admin-pass" type="password" placeholder="Mot de passe admin"
      style="padding:10px;width:100%;margin-top:15px;border-radius:8px;">

    <button onclick="login()" class="btn-access" style="width:100%;margin-top:15px;">
      Se connecter
    </button>

    <p id="login-error" style="color:#b76e79;margin-top:10px;"></p>
  </div>
</section>

<!-- DASHBOARD -->
<section class="card" id="dashboard" style="display:none;">
  <div class="service-box">
    <b>🛠️ Générateur de codes uniques</b>

    <label style="margin-top:15px;display:block;">Choisissez la formation :</label>
    <select id="type" style="padding:10px;width:100%;border-radius:8px;">
      <option value="cinema">Cinéma & IA</option>
      <option value="marketing">Marketing Digital</option>
      <option value="vip">Accès Complet VIP</option>
    </select>

    <button onclick="genererCode()" class="cta-button" style="margin-top:15px;">
      Générer un code unique
    </button>

    <p id="new-code" style="margin-top:15px;font-size:16px;"></p>

    <button onclick="copierCode()" class="btn-access" style="margin-top:10px;width:100%;">
      Copier le code
    </button>

    <p id="whatsapp" style="margin-top:20px;"></p>
  </div>
</section>

<script>
// ----------------- CONNEXION ADMIN -----------------

function login() {
  const pass = document.getElementById("admin-pass").value;
  if (pass === "ESPOIR2026") {
    document.getElementById("login-section").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
  } else {
    document.getElementById("login-error").innerText = "Mot de passe incorrect.";
  }
}

// ----------------- GÉNÉRATION D'UN CODE UNIQUE -----------------

function genererCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 7; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }

  const type = document.getElementById("type").value;

  document.getElementById("new-code").innerHTML =
    "👉 <b>Code généré :</b> " + code;

  const lienPage =
    type === "cinema"
      ? "cinema.html"
      : type === "marketing"
      ? "marketing.html"
      : "complet.html";

  const message =
    "🎉 Votre accès est validé !%0A%0A" +
    "🔑 Code unique : " + code + "%0A" +
    "🌐 Page d'accès : [papaya-conkies-490d59.netlify.app](https://papaya-conkies-490d59.netlify.app/)" + lienPage + "%0A%0A" +
    "⚠️ Ce code fonctionne une seule fois.";

  document.getElementById("whatsapp").innerHTML =
    `<a href="[wa.me](https://wa.me/2250709458015?text=${message})" class="btn-access" style="display:block;margin-top:10px;">
       Envoyer sur WhatsApp
     </a>`;
}

// ----------------- COPIER LE CODE -----------------

function copierCode() {
  const code = document.getElementById("new-code").innerText.replace("👉 Code généré :", "").trim();
  navigator.clipboard.writeText(code);
  alert("Code copié !");
}

</script>

</body>
</html>
